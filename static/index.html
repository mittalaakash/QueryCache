<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LangGraph Trip Planner (HITL demo)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  #log { background: #f4f4f4; border-radius: 8px; padding: 12px; min-height: 100px; white-space: pre-wrap; font-size: 0.9rem; }
  .step { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #ddd; }
  .step b { color: #333; }
  #review { display: none; border: 2px solid #d97706; border-radius: 8px; padding: 12px; margin-top: 16px; }
  textarea { width: 100%; box-sizing: border-box; height: 60px; margin: 4px 0; }
  button { margin-right: 8px; padding: 6px 14px; cursor: pointer; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; }
</style>
</head>
<body>
<h1>LangGraph + Ollama trip planner (human-in-the-loop demo)</h1>

<input id="goal" type="text" value="3 day trip to Lisbon, budget $800" />
<button id="start">Start</button>

<div id="log"></div>

<div id="review">
  <h3>Human review needed</h3>
  <div><b>Budget</b></div>
  <textarea id="budgetEdit"></textarea>
  <div><b>Itinerary</b></div>
  <textarea id="itineraryEdit"></textarea>
  <div>
    <button id="approve">Approve</button>
    <button id="edit">Approve with edits</button>
    <button id="reject">Reject</button>
  </div>
</div>

<script>
const log = document.getElementById('log');
const reviewBox = document.getElementById('review');
const budgetEdit = document.getElementById('budgetEdit');
const itineraryEdit = document.getElementById('itineraryEdit');
let threadId;

function addLine(html) {
  const div = document.createElement('div');
  div.className = 'step';
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function handleMessage(msg) {
  if (msg.type === 'step') {
    addLine(`<b>${msg.node}</b><br>${JSON.stringify(msg.data)}`);
  } else if (msg.type === 'interrupt') {
    addLine(`<b>human_review</b> — paused, waiting for you`);
    budgetEdit.value = msg.data.budget;
    itineraryEdit.value = msg.data.itinerary;
    reviewBox.style.display = 'block';
  } else if (msg.type === 'done') {
    addLine(`<b>done</b><br>${JSON.stringify(msg.data)}`);
  }
}

async function streamResponse(res) {
  const th = res.headers.get('X-Thread-Id');
  if (th) threadId = th;
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (raw.startsWith('data: ')) handleMessage(JSON.parse(raw.slice(6)));
    }
  }
}

document.getElementById('start').onclick = () => {
  log.innerHTML = '';
  reviewBox.style.display = 'none';
  fetch('/run/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ goal: document.getElementById('goal').value }),
  }).then(streamResponse);
};

function resume(action, data) {
  reviewBox.style.display = 'none';
  fetch(`/run/${threadId}/resume`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, data: data || {} }),
  }).then(streamResponse);
}

document.getElementById('approve').onclick = () => resume('approve');
document.getElementById('reject').onclick = () => resume('reject');
document.getElementById('edit').onclick = () =>
  resume('edit', { budget: budgetEdit.value, itinerary: itineraryEdit.value });
</script>
</body>
</html>
