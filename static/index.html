<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RAG Document Q&amp;A</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1.05rem; margin-top: 32px; }
  #answer { background: #f4f4f4; border-radius: 8px; padding: 12px; min-height: 60px; white-space: pre-wrap; font-size: 0.95rem; }
  #sources { font-size: 0.85rem; color: #555; margin: 8px 0; }
  #sources span { display: inline-block; background: #e7e7e7; border-radius: 4px; padding: 2px 8px; margin: 2px 4px 2px 0; }
  #sources .cache-badge { background: #dcfce7; color: #166534; font-weight: 600; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; padding: 6px; }
  textarea { height: 140px; margin: 4px 0; }
  button { margin: 8px 0; padding: 6px 14px; cursor: pointer; }
  #docList { font-size: 0.85rem; padding-left: 18px; }
  #docList li { margin-bottom: 4px; }
</style>
</head>
<body>
<h1>Document Q&amp;A (RAG demo)</h1>

<input id="question" type="text" placeholder="Ask a question about the ingested documents..." />
<button id="ask">Ask</button>

<div id="sources"></div>
<div id="answer"></div>

<h2>Documents</h2>
<ul id="docList"></ul>

<h2>Add / update a document</h2>
<input id="title" type="text" placeholder="Title" />
<textarea id="content" placeholder="Markdown content..."></textarea>
<button id="save">Save &amp; ingest</button>
<button id="newDoc" type="button">New document</button>
<div id="saveStatus"></div>

<script>
const answerBox = document.getElementById('answer');
const sourcesBox = document.getElementById('sources');
const docList = document.getElementById('docList');
let editingPath = null;

async function loadDocuments() {
  const res = await fetch('/documents');
  const docs = await res.json();
  docList.replaceChildren(...docs.map(d => {
    const li = document.createElement('li');
    const b = document.createElement('b');
    b.textContent = d.title;
    const editBtn = document.createElement('button');
    editBtn.textContent = 'Edit';
    editBtn.onclick = () => loadForEdit(d.path);
    li.append(b, document.createTextNode(` — ${d.path} (updated ${d.updated_at}) `), editBtn);
    return li;
  }));
}

async function loadForEdit(path) {
  const res = await fetch(`/documents/content?path=${encodeURIComponent(path)}`);
  if (!res.ok) return;
  const body = await res.json();
  document.getElementById('content').value = body.content;
  editingPath = path;
  document.getElementById('saveStatus').textContent = `Editing ${path}`;
}

async function ask() {
  const question = document.getElementById('question').value;
  if (!question) return;
  answerBox.textContent = '';
  sourcesBox.innerHTML = '';

  const res = await fetch('/query', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question }),
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (!raw.startsWith('data: ')) continue;
      const msg = JSON.parse(raw.slice(6));
      if (msg.type === 'sources') {
        sourcesBox.innerHTML = msg.cached ? '<span class="cache-badge">⚡ cached</span>' : '';
        msg.data.forEach(s => {
          const span = document.createElement('span');
          span.textContent = s.title;
          sourcesBox.appendChild(span);
        });
      } else if (msg.type === 'token') {
        answerBox.textContent += msg.data;
      }
    }
  }
}

document.getElementById('ask').onclick = ask;

document.getElementById('save').onclick = async () => {
  const title = document.getElementById('title').value;
  const content = document.getElementById('content').value;
  if (!content || (!editingPath && !title)) return;

  const status = document.getElementById('saveStatus');
  status.textContent = 'Saving...';
  const payload = { title, content };
  if (editingPath) payload.path = editingPath;
  const res = await fetch('/documents', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const body = await res.json();
  status.textContent = `Saved (${body.action}).`;
  editingPath = null;
  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  loadDocuments();
};

document.getElementById('newDoc').onclick = () => {
  editingPath = null;
  document.getElementById('title').value = '';
  document.getElementById('content').value = '';
  document.getElementById('saveStatus').textContent = '';
};

loadDocuments();
</script>
</body>
</html>
